<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚁 VWorld 5개 공역 지도 테스트 (STEP 3-8)</title>

  <!-- Leaflet 1.9.4 CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Turf.js v7 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      --primary: #2563eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      line-height: 1.5;
    }

    header {
      text-align: center;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .main-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .main-container {
        grid-template-columns: 360px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 6px;
    }

    #map {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      z-index: 1;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button.btn-primary {
      background-color: var(--primary);
      color: white;
    }
    button.btn-primary:hover { background-color: #1d4ed8; }

    button.btn-secondary {
      background-color: #e2e8f0;
      color: #334155;
    }
    button.btn-secondary:hover { background-color: #cbd5e1; }

    button.btn-success {
      background-color: #10b981;
      color: white;
    }
    button.btn-success:hover { background-color: #059669; }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    input[type="number"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #f8fafc;
    }

    /* 레이어 ON/OFF 토글 스타일 */
    .toggle-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      font-size: 13px;
      font-weight: 600;
    }

    .toggle-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin: 0;
      color: var(--text-main);
      font-size: 13px;
    }

    .toggle-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .color-pill {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      display: inline-block;
    }

    .hero-box {
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 8px;
    }
    .hero-safe { background: #dcfce7; border: 1px solid #86efac; color: #14532d; }
    .hero-warning { background: #fef3c7; border: 1px solid #fde047; color: #713f12; }
    .hero-danger { background: #fee2e2; border: 1px solid #fca5a5; color: #7f1d1d; }

    .hero-title {
      font-size: 16px;
      font-weight: 800;
    }

    .layer-result-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-included { background: #fee2e2; color: #b91c1c; }
    .badge-excluded { background: #dcfce7; color: #15803d; }
    .badge-err { background: #fef2f2; color: #991b1b; }

    .disclaimer {
      font-size: 11px;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 8px;
      border-radius: 6px;
      line-height: 1.4;
      margin-top: 6px;
    }

    .status-summary {
      font-size: 12px;
      background: #e2e8f0;
      padding: 4px 8px;
      border-radius: 12px;
      font-weight: bold;
      color: #334155;
    }

    /* Popup 스타일 */
    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      padding: 4px;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 4px;
      margin-bottom: 6px;
    }
    .popup-item {
      font-size: 12px;
      margin-bottom: 2px;
    }

    code {
      background: #e2e8f0;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>

<body>

  <header>
    <h1>🚁 VWorld 5개 공역 지도 테스트</h1>
  </header>

  <div class="main-container">
    
    <!-- 좌측 컨트롤 & 판정 결과 패널 -->
    <div class="sidebar">
      
      <!-- 1. 제어 버튼 & WFS 상태 -->
      <div class="card">
        <div class="card-title">
          <span>📡 WFS 상태</span>
          <span id="wfsStatusSummary" class="status-summary">대기 중</span>
        </div>
        
        <div class="btn-group">
          <button class="btn-success" style="flex: 1;" onclick="reloadAllAirspace()">
            🔄 공역 새로고침
          </button>
          <button class="btn-primary" style="flex: 1;" onclick="fetchCurrentGpsLocation()">
            📍 현재 위치
          </button>
        </div>

        <div id="gpsStatusText" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
          GPS: 미작동 (버튼 클릭 시 측정)
        </div>
      </div>

      <!-- 2. 레이어 ON/OFF 컨트롤 -->
      <div class="card">
        <div class="card-title">🗺️ 공역 레이어 표시 (ON/OFF)</div>
        <div class="toggle-list" id="layerToggleList">
          <!-- 스크립트로 생성 -->
        </div>
      </div>

      <!-- 3. 수동 좌표 테스트 -->
      <div class="card">
        <div class="card-title">🧪 수동 좌표 입력</div>
        <div class="btn-group">
          <button class="btn-secondary" onclick="setManualCoords(37.5665, 126.9780)">[서울시청]</button>
          <button class="btn-secondary" onclick="setManualCoords(36.9910, 127.9259)">[충주]</button>
          <button class="btn-secondary" onclick="setManualCoords(37.5400, 126.9800)">[37.54/126.98]</button>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="inputLat">위도</label>
            <input type="number" id="inputLat" step="any" value="37.540000">
          </div>
          <div class="form-group">
            <label for="inputLon">경도</label>
            <input type="number" id="inputLon" step="any" value="126.980000">
          </div>
        </div>

        <div class="btn-group">
          <button class="btn-secondary" style="flex: 1;" onclick="moveToManualCoords()">
            📍 이 좌표로 지도 이동
          </button>
          <button class="btn-primary" style="flex: 1;" onclick="inspectManualCoords()">
            🔍 이 좌표 공역 판정
          </button>
        </div>
      </div>

      <!-- 4. 현재 검사 좌표 & 판정 결과 -->
      <div class="card">
        <div class="card-title">🚨 현재 위치 공역 판정</div>
        
        <div style="font-size: 13px; margin-bottom: 8px;">
          <strong>📍 검사 좌표:</strong> <code id="dispCoords">미측정</code>
        </div>

        <div id="heroBox" class="hero-box hero-safe">
          <div class="hero-title" id="heroTitle">검사 준비</div>
          <div id="heroDesc" style="font-size: 12px;">공역 새로고침 또는 좌표 검사를 진행하세요.</div>
        </div>

        <div id="layerJudgeList" style="font-size: 13px; display: flex; flex-direction: column; gap: 4px;">
          <!-- 5개 공역 포함 상태 목록 -->
        </div>

        <div class="disclaimer">
          ※ 위 결과는 공간 데이터 기반 참고용이며 법적 비행 가능 여부를 판단하는 기능이 아닙니다. 실제 비행 가능 여부 및 필요한 승인은 <strong>공식 드론원스톱 민원서비스</strong>에서 확인하세요.
        </div>
      </div>

    </div>

    <!-- 우측 Leaflet 지도 영역 -->
    <div class="map-area">
      <div id="map"></div>
    </div>

  </div>

  <script>
    // ============================================================
    // 설정 및 변수
    // ============================================================
    const PROXY_URL = "/api/wfs";
    const VWORLD_KEY = "AD89B886-AE05-46EE-8FD1-DDF31E54FF75";
    const VWORLD_DOMAIN = "localhost";

    // 대한민국 전체 커버용 디폴트 BBOX (minLon, minLat, maxLon, maxLat)
    const KR_BBOX = "124.0,33.0,132.0,39.5";

    // 5개 레이어 스펙 정의
    const AIRSPACE_LAYERS = [
      {
        key: "prohibited",
        typename: "lt_c_aisprhc",
        name: "비행금지구역",
        icon: "🔴",
        color: "#ef4444",
        priority: 1,
        propFields: ["prh_lbl_1", "prh_lbl_2", "prh_lbl_3", "prh_lbl_4", "prh_typ"]
      },
      {
        key: "temporary",
        typename: "lt_c_aistemp",
        name: "임시비행금지공역",
        icon: "🟣",
        color: "#a855f7",
        priority: 2,
        propFields: ["tmp_lbl_1", "tmp_lbl_2", "tmp_lbl_3"]
      },
      {
        key: "restricted",
        typename: "lt_c_aisresc",
        name: "비행제한구역",
        icon: "🟠",
        color: "#f97316",
        priority: 3,
        propFields: ["res_lbl_1", "res_lbl_2", "res_lbl_3"]
      },
      {
        key: "control",
        typename: "lt_c_aisctrc",
        name: "관제권",
        icon: "🟡",
        color: "#eab308",
        priority: 4,
        propFields: ["ctr_lbl_1", "ctr_lbl_2", "ctr_lbl_3"]
      },
      {
        key: "uac",
        typename: "lt_c_aisuac",
        name: "초경량비행장치공역",
        icon: "🔵",
        color: "#3b82f6",
        priority: 5,
        propFields: ["uac_lbl_1", "uac_lbl_2", "uac_lbl_3"]
      }
    ];

    // 상태 관리
    let map = null;
    let geoJsonLayerGroups = {}; // key -> L.geoJSON
    let layerDataStore = {};     // key -> GeoJSON raw data
    let currentMarker = null;    // 수동/GPS 마커
    let currentCircle = null;    // GPS 오차 범위 원

    // ============================================================
    // 1. 지도 및 초기 설정
    // ============================================================
    function initMap() {
      // 초기 대한민국 전체 중심
      map = L.map("map").setView([36.5, 127.8], 7);

      // OpenStreetMap 타일 레이어
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>'
      }).addTo(map);

      // 토글 UI 생성
      buildToggleUI();

      // 초기 5개 공역 데이터 로드 및 초기 좌표(37.54, 126.98) 판정
      console.log("🚁 STEP 3-8 시작");
      reloadAllAirspace().then(() => {
        inspectManualCoords();
      });
    }

    // 레이어 ON/OFF 체크박스 생성
    function buildToggleUI() {
      const container = document.getElementById("layerToggleList");
      container.innerHTML = "";

      // 화면 출력 순서 (초경량, 비행금지, 비행제한, 임시금지, 관제권)
      const displayOrder = ["uac", "prohibited", "restricted", "temporary", "control"];
      const sortedLayers = AIRSPACE_LAYERS.slice().sort((a, b) => {
        return displayOrder.indexOf(a.key) - displayOrder.indexOf(b.key);
      });

      sortedLayers.forEach(layer => {
        const item = document.createElement("div");
        item.className = "toggle-item";
        item.innerHTML = `
          <label>
            <input type="checkbox" id="chk_${layer.key}" checked onchange="toggleLayer('${layer.key}')">
            <span class="color-pill" style="background-color: ${layer.color};"></span>
            <span>${layer.icon} ${layer.name}</span>
          </label>
          <span id="badge_${layer.key}" style="font-size: 11px; color: var(--text-muted);">대기</span>
        `;
        container.appendChild(item);
      });
    }

    // ============================================================
    // 2. WFS 5개 레이어 로드 & Leaflet GeoJSON 표시
    // ============================================================
    async function reloadAllAirspace() {
      console.log("📡 5개 WFS 요청 시작");
      document.getElementById("wfsStatusSummary").innerText = "수신 중...";

      // WFS 병렬 요청
      const fetchPromises = AIRSPACE_LAYERS.map(layer => fetchWfsLayer(layer));
      const results = await Promise.all(fetchPromises);

      let successCount = 0;
      results.forEach(res => {
        if (res.success) {
          successCount++;
          // Leaflet GeoJSON 생성 및 지도 표시
          renderGeoJsonOnMap(res.layer, res.data);
          document.getElementById(`badge_${res.layer.key}`).innerText = `${res.featureCount}개 (${res.elapsed}ms)`;
        } else {
          document.getElementById(`badge_${res.layer.key}`).innerText = `❌ 실패`;
        }
      });

      document.getElementById("wfsStatusSummary").innerText = `${successCount} / ${AIRSPACE_LAYERS.length} 수신 성공`;
      console.log(`🗺️ 5개 GeoJSON 레이어 표시 완료 (${successCount}/${AIRSPACE_LAYERS.length} 성공)`);

      return results;
    }

    // 단일 WFS 레이어 가져오기
    async function fetchWfsLayer(layer) {
      console.log(`📡 ${layer.typename} 요청 (${layer.name})`);

      const params = new URLSearchParams({
        SERVICE: "WFS",
        VERSION: "1.1.0",
        REQUEST: "GetFeature",
        TYPENAME: layer.typename,
        OUTPUTFORMAT: "application/json",
        SRSNAME: "EPSG:4326",
        BBOX: KR_BBOX,
        KEY: VWORLD_KEY.trim(),
        DOMAIN: VWORLD_DOMAIN
      });

      const url = `${PROXY_URL}?${params.toString()}`;
      const startTime = performance.now();

      try {
        const response = await fetch(url);
        const elapsed = Math.round(performance.now() - startTime);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const features = data.features || [];
        const featureCount = features.length;

        console.log(`✅ ${layer.typename}\nFeature 수: ${featureCount}\n응답 시간: ${elapsed}ms`);

        // 원본 데이터 보관
        layerDataStore[layer.key] = data;

        return {
          layer: layer,
          success: true,
          elapsed: elapsed,
          featureCount: featureCount,
          data: data
        };

      } catch (err) {
        console.error(`❌ ${layer.typename} 수신 실패:`, err.message);
        return {
          layer: layer,
          success: false,
          error: err.message,
          featureCount: 0,
          data: null
        };
      }
    }

    // Leaflet GeoJSON 렌더링
    function renderGeoJsonOnMap(layer, geojsonData) {
      // 기존 레이어 그룹 제거
      if (geoJsonLayerGroups[layer.key]) {
        map.removeLayer(geoJsonLayerGroups[layer.key]);
      }

      if (!geojsonData || !geojsonData.features) return;

      const geoJsonGroup = L.geoJSON(geojsonData, {
        style: function (feature) {
          return {
            color: layer.color,
            weight: 2,
            opacity: 0.85,
            fillColor: layer.color,
            fillOpacity: 0.25
          };
        },
        onEachFeature: function (feature, leafletLayer) {
          // Popup 바인딩
          const popupContent = createPopupHtml(layer, feature);
          leafletLayer.bindPopup(popupContent);
        }
      });

      geoJsonLayerGroups[layer.key] = geoJsonGroup;

      // 체크박스 상태에 따라 지도 추가
      const chk = document.getElementById(`chk_${layer.key}`);
      if (chk && chk.checked) {
        geoJsonGroup.addTo(map);
      }
    }

    // Popup HTML 생성
    function createPopupHtml(layer, feature) {
      let html = `<div class="popup-title">${layer.icon} ${layer.name}</div>`;
      const props = feature.properties;

      if (!props) {
        return html + `<div class="popup-item"><i>상세 정보 없음</i></div>`;
      }

      let count = 0;
      layer.propFields.forEach(f => {
        if (props[f]) {
          html += `<div class="popup-item"><strong>${f}:</strong> ${props[f]}</div>`;
          count++;
        }
      });

      if (count === 0) {
        for (let k in props) {
          if (props[k] && typeof props[k] !== 'object') {
            html += `<div class="popup-item"><strong>${k}:</strong> ${props[k]}</div>`;
            count++;
            if (count >= 3) break;
          }
        }
      }

      if (count === 0) {
        html += `<div class="popup-item"><i>상세 정보 없음</i></div>`;
      }

      return html;
    }

    // ============================================================
    // 3. 레이어 ON/OFF 토글
    // ============================================================
    function toggleLayer(key) {
      const chk = document.getElementById(`chk_${key}`);
      const geoGroup = geoJsonLayerGroups[key];

      if (!geoGroup) return;

      if (chk.checked) {
        if (!map.hasLayer(geoGroup)) {
          map.addLayer(geoGroup);
        }
      } else {
        if (map.hasLayer(geoGroup)) {
          map.removeLayer(geoGroup);
        }
      }
    }

    // ============================================================
    // 4. 수동 좌표 테스트 및 Point-in-Polygon
    // ============================================================
    function setManualCoords(lat, lon) {
      document.getElementById("inputLat").value = lat.toFixed(6);
      document.getElementById("inputLon").value = lon.toFixed(6);
      inspectManualCoords();
    }

    function moveToManualCoords() {
      const lat = parseFloat(document.getElementById("inputLat").value);
      const lon = parseFloat(document.getElementById("inputLon").value);

      if (isNaN(lat) || isNaN(lon)) return;
      map.setView([lat, lon], 12);
      updateMarker(lat, lon, "수동 테스트 위치");
    }

    function inspectManualCoords() {
      const lat = parseFloat(document.getElementById("inputLat").value);
      const lon = parseFloat(document.getElementById("inputLon").value);

      if (isNaN(lat) || isNaN(lon)) {
        alert("올바른 위도와 경도를 입력하세요.");
        return;
      }

      map.setView([lat, lon], 11);
      updateMarker(lat, lon, "수동 테스트 위치");

      runPointInPolygonAnalysis(lat, lon);
    }

    // ============================================================
    // 5. GPS 현재 위치 획득
    // ============================================================
    function fetchCurrentGpsLocation() {
      const txt = document.getElementById("gpsStatusText");
      txt.innerText = "GPS 측정 중...";

      if (!navigator.geolocation) {
        txt.innerText = "Geolocation 미지원 브라우저";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const acc = pos.coords.accuracy;

          let accInfo = `정확도: 약 ${Math.round(acc)}m`;
          if (acc > 200) {
            accInfo += ` (🔴 GPS 정확도가 낮습니다)`;
          } else {
            accInfo += ` (🟢 양호)`;
          }

          txt.innerText = `GPS: 위도 ${lat.toFixed(6)}, 경도 ${lon.toFixed(6)} | ${accInfo}`;

          // 지도 이동 및 마커/원 표시
          map.setView([lat, lon], 13);
          updateMarker(lat, lon, `현재 위치 (정확도 ${Math.round(acc)}m)`, acc);

          // 수동 입력창도 현재 좌표로 업데이트
          document.getElementById("inputLat").value = lat.toFixed(6);
          document.getElementById("inputLon").value = lon.toFixed(6);

          // 공간 판정 실행
          runPointInPolygonAnalysis(lat, lon);
        },
        (err) => {
          txt.innerText = `GPS 측정 실패: ${err.message}`;
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    }

    // 마커 및 오차 범위 원 업데이트
    function updateMarker(lat, lon, title, accuracy = 0) {
      if (currentMarker) map.removeLayer(currentMarker);
      if (currentCircle) map.removeLayer(currentCircle);

      currentMarker = L.marker([lat, lon]).addTo(map).bindPopup(title).openPopup();

      if (accuracy > 0) {
        currentCircle = L.circle([lat, lon], {
          radius: accuracy,
          color: "#2563eb",
          fillColor: "#3b82f6",
          fillOpacity: 0.15
        }).addTo(map);
      }
    }

    // ============================================================
    // 6. Turf.js Point-in-Polygon 판정 로직
    // ============================================================
    function runPointInPolygonAnalysis(lat, lon) {
      console.log(`📍 현재 검사 좌표: ${lat.toFixed(6)}, ${lon.toFixed(6)}`);
      document.getElementById("dispCoords").innerText = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;

      const targetPoint = turf.point([lon, lat]);
      const results = [];

      AIRSPACE_LAYERS.forEach(layer => {
        const data = layerDataStore[layer.key];
        const matched = [];

        if (data && data.features) {
          data.features.forEach(feat => {
            if (!feat.geometry) return;
            try {
              if (turf.booleanPointInPolygon(targetPoint, feat)) {
                matched.push(feat);
              }
            } catch (tErr) {
              console.error(`Turf error in ${layer.key}:`, tErr);
            }
          });
        }

        results.push({
          layer: layer,
          isIncluded: matched.length > 0,
          matchedCount: matched.length,
          matchedFeatures: matched
        });
      });

      renderJudgeResults(results);
    }

    // 판정 결과 UI 렌더링
    function renderJudgeResults(results) {
      const heroBox = document.getElementById("heroBox");
      const heroTitle = document.getElementById("heroTitle");
      const heroDesc = document.getElementById("heroDesc");
      const listContainer = document.getElementById("layerJudgeList");

      // 1. 대표 판정 결정 (우선순위 순서)
      const included = results.filter(r => r.isIncluded).sort((a, b) => a.layer.priority - b.layer.priority);

      if (included.length > 0) {
        const top = included[0];
        if (top.layer.priority === 1) { // 비행금지구역
          heroBox.className = "hero-box hero-danger";
          heroTitle.innerText = `🚫 ${top.layer.name} 포함`;
          heroDesc.innerText = `현재 좌표가 최고 위험 구역인 [${top.layer.name}]에 포함되어 있습니다.`;
          console.log(`🚫 비행금지구역 포함`);
        } else if (top.layer.priority <= 3) {
          heroBox.className = "hero-box hero-danger";
          heroTitle.innerText = `⚠️ ${top.layer.name} 포함`;
          heroDesc.innerText = `현재 좌표가 [${top.layer.name}] 구역에 포함되어 있습니다.`;
          console.log(`⚠️ ${top.layer.name} 포함`);
        } else {
          heroBox.className = "hero-box hero-warning";
          heroTitle.innerText = `⚠️ ${top.layer.name} 포함`;
          heroDesc.innerText = `현재 좌표가 [${top.layer.name}] 영향권에 포함되어 있습니다.`;
          console.log(`⚠️ ${top.layer.name} 포함`);
        }
      } else {
        heroBox.className = "hero-box hero-safe";
        heroTitle.innerText = `🎉 주요 공역 미포함`;
        heroDesc.innerText = `수신된 5개 공역 데이터 상 포함된 구역이 없습니다.`;
        console.log(`🎉 주요 공역 미포함`);
      }

      // 2. 5개 레이어 개별 결과 표출 (화면 정렬 순서)
      const displayOrder = ["uac", "prohibited", "restricted", "temporary", "control"];
      const displaySorted = results.slice().sort((a, b) => {
        return displayOrder.indexOf(a.layer.key) - displayOrder.indexOf(b.layer.key);
      });

      let html = "";
      displaySorted.forEach(r => {
        const l = r.layer;
        html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:4px 0; border-bottom: 1px dashed #e2e8f0;">`;
        html += `  <span>${l.icon} ${l.name}</span>`;
        if (r.isIncluded) {
          html += `  <span class="layer-result-badge badge-included">🚫 포함 (${r.matchedCount}개)</span>`;
        } else {
          html += `  <span class="layer-result-badge badge-excluded">✅ 미포함</span>`;
        }
        html += `</div>`;
      });

      listContainer.innerHTML = html;
    }

    // DOM 로드 완료 시 실행
    window.addEventListener("DOMContentLoaded", () => {
      initMap();
    });
  </script>
</body>
</html>
